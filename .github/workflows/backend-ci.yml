
name: Pulse Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Build and Test Go Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci_password
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://pulse:pulse_ci_password@127.0.0.1:5432/pulse_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.29.0

      - name: Apply database migrations
        run: |
          "$(go env GOPATH)/bin/goose" \
            -dir migrations \
            postgres "$TEST_DATABASE_URL" up

      - name: Check code with go vet
        run: go vet ./...

      - name: Build backend
        run: go build ./...

      - name: Run tests with race detector
        run: go test -race ./... -v -count=1
